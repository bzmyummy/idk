<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>包剪揼 — Game 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-gradient-dark: linear-gradient(180deg, #021124, #071129);
            --bg-gradient-light: linear-gradient(180deg, #f8fafc, #e2e8f0);
            --text-dark: #e6eef8;
            --text-light: #1e293b;
            --card-bg-dark: rgba(255, 255, 255, 0.03);
            --card-bg-light: rgba(255, 255, 255, 0.95);
            --button-bg-dark: #111827;
            --button-bg-light: #f1f5f9;
            --button-text-dark: #e6eef8;
            --button-text-light: #1e293b;
            --button-border-dark: rgba(255, 255, 255, 0.1);
            --button-border-light: rgba(0, 0, 0, 0.1);
            --score-color-dark: #9ca3af;
            --score-color-light: #64748b;
            --link-color-dark: #9ca3af;
            --link-color-light: #64748b;
            --result-color-dark: #cbd5e1;
            --result-color-light: #475569;
        }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: Inter, Arial, sans-serif;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: var(--bg-gradient-dark);
            color: var(--text-dark);
        }

        body:not(.dark) {
            background: var(--bg-gradient-light);
            color: var(--text-light);
        }

        .card {
            padding: 24px;
            border-radius: 12px;
            text-align: center;
            min-width: 320px;
            transition: all 0.3s;
        }

        body.dark .card {
            background: var(--card-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body:not(.dark) .card {
            background: var(--card-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        .choices {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 12px;
        }

        button[data-move] {
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 24px;
            min-width: 60px;
        }

        body.dark button[data-move] {
            background: var(--button-bg-dark);
            color: var(--button-text-dark);
            border: 1px solid var(--button-border-dark);
        }

        body:not(.dark) button[data-move] {
            background: var(--button-bg-light);
            color: var(--button-text-light);
            border: 1px solid var(--button-border-light);
        }

        button[data-move]:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }

        #result {
            margin-top: 12px;
            min-height: 24px;
            transition: color 0.3s;
        }

        body.dark #result {
            color: var(--result-color-dark);
        }

        body:not(.dark) #result {
            color: var(--result-color-light);
        }

        .score {
            margin-top: 12px;
            transition: color 0.3s;
        }

        body.dark .score {
            color: var(--score-color-dark);
        }

        body:not(.dark) .score {
            color: var(--score-color-light);
        }

        a {
            display: block;
            margin-top: 10px;
            transition: color 0.3s;
        }

        body.dark a {
            color: var(--link-color-dark);
        }

        body:not(.dark) a {
            color: var(--link-color-light);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        body:not(.dark) .theme-toggle {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
</head>
<body class="dark">
    <div class="theme-toggle" id="themeToggle">
        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
    </div>

    <div class="card">
        <h2>✊✌️✋ 包剪揼</h2>
        <div>選擇一個：</div>
        <div class="choices">
            <button data-move="rock">✊</button>
            <button data-move="paper">✋</button>
            <button data-move="scissors">✌️</button>
        </div>
        <div id="result" style="margin-top:12px"></div>
        <div class="score">你: <span id="pScore">0</span> • 電腦: <span id="cScore">0</span></div>
        <a href="index.html">← 返回主頁</a>
    </div>

    <script>
        // 主題切換功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        // 檢查保存的主題或系統偏好
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            body.classList.remove('dark');
            themeIcon.textContent = 'dark_mode';
        } else {
            body.classList.add('dark');
            themeIcon.textContent = 'light_mode';
        }

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = 'dark_mode';
            } else {
                body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = 'light_mode';
            }
        });

        // 遊戲邏輯
        const buttons = document.querySelectorAll('button[data-move]');
        const result = document.getElementById('result');
        let pScore = 0, cScore = 0;

        function compMove() {
            const arr = ['rock', 'paper', 'scissors'];
            return arr[Math.floor(Math.random() * 3)];
        }

        function decide(p, c) {
            if (p === c) return 'draw';
            if ((p === 'rock' && c === 'scissors') ||
                (p === 'scissors' && c === 'paper') ||
                (p === 'paper' && c === 'rock')) return 'win';
            return 'lose';
        }

        buttons.forEach(b => b.addEventListener('click', () => {
            const p = b.dataset.move;
            const c = compMove();
            const r = decide(p, c);
            
            if (r === 'win') {
                pScore++;
                result.textContent = `你出 ${p}；電腦出 ${c}。你贏！`;
            } else if (r === 'lose') {
                cScore++;
                result.textContent = `你出 ${p}；電腦出 ${c}。你輸啦。`;
            } else {
                result.textContent = `你出 ${p}；電腦出 ${c}。平手。`;
            }
            
            document.getElementById('pScore').textContent = pScore;
            document.getElementById('cScore').textContent = cScore;
        }));
    </script>
</body>
</html>
