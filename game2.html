<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>猜數字 — Game 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --bg-gradient-dark: linear-gradient(180deg, #0f1724, #071129);
            --bg-gradient-light: linear-gradient(180deg, #f8fafc, #e2e8f0);
            --text-dark: #e6eef8;
            --text-light: #1e293b;
            --box-bg-dark: rgba(255, 255, 255, 0.04);
            --box-bg-light: rgba(255, 255, 255, 0.9);
            --input-border-dark: rgba(255, 255, 255, 0.06);
            --input-border-light: rgba(0, 0, 0, 0.1);
            --input-bg-dark: transparent;
            --input-bg-light: white;
            --button-bg: #7c3aed;
            --link-color-dark: #9ca3af;
            --link-color-light: #64748b;
            --out-color-dark: #cbd5e1;
            --out-color-light: #475569;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            transition: background 0.3s, color 0.3s;
        }

        body.dark {
            background: var(--bg-gradient-dark);
            color: var(--text-dark);
        }

        body:not(.dark) {
            background: var(--bg-gradient-light);
            color: var(--text-light);
        }

        .box {
            padding: 28px;
            border-radius: 12px;
            text-align: center;
            min-width: 320px;
            transition: background 0.3s;
        }

        body.dark .box {
            background: var(--box-bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        body:not(.dark) .box {
            background: var(--box-bg-light);
            border: 1px solid rgba(0, 0, 0, 0.1);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            margin-top: 12px;
            transition: all 0.3s;
        }

        body.dark input {
            border: 1px solid var(--input-border-dark);
            background: var(--input-bg-dark);
            color: var(--text-dark);
        }

        body:not(.dark) input {
            border: 1px solid var(--input-border-light);
            background: var(--input-bg-light);
            color: var(--text-light);
        }

        button {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            background: var(--button-bg);
            border: none;
            color: white;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        button:hover {
            opacity: 0.9;
        }

        a {
            display: block;
            margin-top: 14px;
            transition: color 0.3s;
        }

        body.dark a {
            color: var(--link-color-dark);
        }

        body:not(.dark) a {
            color: var(--link-color-light);
        }

        #out {
            margin-top: 12px;
            transition: color 0.3s;
        }

        body.dark #out {
            color: var(--out-color-dark);
        }

        body:not(.dark) #out {
            color: var(--out-color-light);
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        body:not(.dark) .theme-toggle {
            background: rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .material-symbols-outlined {
            font-size: 20px;
        }
    </style>
</head>
<body class="dark">
    <div class="theme-toggle" id="themeToggle">
        <span class="material-symbols-outlined" id="themeIcon">light_mode</span>
    </div>
    
    <div class="box">
        <h2>🎯 猜數字</h2>
        <p class="hint">我諗住一個 1–100 之間嘅數，你有 8 次機會搵出佢。</p>
        <input id="guess" type="number" min="1" max="100" placeholder="輸入你嘅猜測 (1-100)">
        <button id="tryBtn">提交</button>
        <div id="out" style="margin-top:12px"></div>
        <a href="index.html">← 返回主頁</a>
    </div>

    <script>
        // 主題切換功能
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const body = document.body;

        // 檢查保存的主題或系統偏好
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

        if (savedTheme === 'light' || (!savedTheme && !prefersDark)) {
            body.classList.remove('dark');
            themeIcon.textContent = 'dark_mode';
        } else {
            body.classList.add('dark');
            themeIcon.textContent = 'light_mode';
        }

        themeToggle.addEventListener('click', () => {
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
                themeIcon.textContent = 'dark_mode';
            } else {
                body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.textContent = 'light_mode';
            }
        });

        // 遊戲邏輯
        let target, attempts, maxAttempts = 8;
        const out = document.getElementById('out');
        
        function start() { 
            target = Math.floor(Math.random() * 100) + 1; 
            attempts = 0; 
            out.textContent = '開始吧！'; 
            document.getElementById('guess').value = ''; 
        }
        
        document.getElementById('tryBtn').addEventListener('click', () => {
            const val = Number(document.getElementById('guess').value);
            if (!val || val < 1 || val > 100) { 
                out.textContent = '請輸入 1 到 100 之間嘅整數。'; 
                return; 
            }
            attempts++;
            if (val === target) { 
                out.textContent = `答啱！你用咗 ${attempts} 次。按 Reset 可以再玩。`; 
            } else if (attempts >= maxAttempts) { 
                out.textContent = `Game over，冇機會啦。答案係 ${target}。按 Reset 再試。`; 
            } else {
                out.textContent = val < target ? 
                    `太細！仲有 ${maxAttempts - attempts} 次` : 
                    `太大！仲有 ${maxAttempts - attempts} 次`;
            }
        });
        
        // 雙擊重置
        out.addEventListener('dblclick', start);
        
        // 鍵盤 R 鍵重置
        window.addEventListener('keydown', (e) => { 
            if (e.key.toLowerCase() === 'r') start(); 
        });
        
        // 初始化遊戲
        start();
    </script>
</body>
</html>
